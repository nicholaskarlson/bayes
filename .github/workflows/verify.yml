name: Verify public Bayesian companion
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r open-materials/bayesian-reasoning-with-statistics/scripts/requirements.txt
      - run: make verify PYTHON=python
  r-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y r-base
      - run: make r-audit
  r-audit-r36:
    # R 3.6.3, the R that apt installs on Ubuntu 20.04. Before R 4.0, read.csv()
    # turns text columns into factors unless told not to, so this job checks that
    # every R route still reads the IDs and labels as text.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends r-base-core make
      - run: Rscript -e 'stopifnot(getRversion() < "4.0.0")'
      - run: make r-audit
  python-windows:
    # A default Windows checkout (core.autocrlf=true on the runner) tests both
    # the forward-slash inventory and .gitattributes.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r open-materials/bayesian-reasoning-with-statistics/scripts/requirements.txt
      - run: python open-materials/bayesian-reasoning-with-statistics/scripts/verify_public.py
      - name: Independent Python checks
        run: |
          Get-ChildItem open-materials/bayesian-reasoning-with-statistics/scripts/verify_*_independent.py |
            ForEach-Object { python $_.FullName; if ($LASTEXITCODE) { throw "failed: $($_.Name)" } }
