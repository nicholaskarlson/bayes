<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Unit 5 study-hours slopes under two procedures and two priors</title>
<desc id="desc">All estimates are points of belonging score per extra reported study hour. OLS unadjusted: 3.274, 95 percent t interval 2.139 to 4.409. OLS adjusted for commute: 2.766, interval 1.572 to 3.959. Exact Bayesian primary: 2.554, 95 percent credible interval 1.423 to 3.685. Exact Bayesian skeptical: 0.852, credible interval 0.199 to 1.505. A dashed reference at one point per hour is illustrative, not a validated meaningful effect.</desc>
