<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Matched intervals for the fictional help-seeking probability</title>
<desc id="desc">On a probability scale from zero to one, the Wilson 95 percent confidence interval runs from 0.391 to 0.862 with observed proportion 0.667. The Beta(10,6) 95 percent credible interval runs from 0.384 to 0.837 with posterior mean 0.625. A dotted vertical line marks an illustrative threshold of 0.60. Both intervals cross it; their similar endpoints have different interpretations.</desc>
<rect width="1200" height="420" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#16344e">
<text x="46" y="48" font-size="28" font-weight="bold">Same parameter scale, different uncertainty statements</text>
<text x="45" y="131" font-size="21">Wilson 95% confidence interval</text>
<text x="45" y="241" font-size="21">Beta(10,6) 95% credible interval</text>
<path d="M377 315H1117" stroke="#516579" stroke-width="3"/>
<g font-size="18" text-anchor="middle"><text x="377" y="345">0</text><text x="525" y="345">0.2</text><text x="673" y="345">0.4</text><text x="821" y="345">0.6</text><text x="969" y="345">0.8</text><text x="1117" y="345">1</text></g>
<path d="M377 309v12 M525 309v12 M673 309v12 M821 309v12 M969 309v12 M1117 309v12" stroke="#516579" stroke-width="2"/>
<path d="M821 91V310" stroke="#94683c" stroke-width="3" stroke-dasharray="7 7"/>
<text x="835" y="379" font-size="18" fill="#82582f">0.60 illustrative threshold</text>
<path d="M666 152H1015" stroke="#246787" stroke-width="13" stroke-linecap="round"/>
<circle cx="666" cy="152" r="7" fill="#246787"/><circle cx="1015" cy="152" r="7" fill="#246787"/><circle cx="871" cy="152" r="11" fill="#123c54"/>
<text x="666" y="181" font-size="17" text-anchor="middle">0.391</text><text x="1015" y="181" font-size="17" text-anchor="middle">0.862</text>
<path d="M661 262H996" stroke="#71843c" stroke-width="13" stroke-linecap="round"/>
<circle cx="661" cy="262" r="7" fill="#71843c"/><circle cx="996" cy="262" r="7" fill="#71843c"/><circle cx="839" cy="262" r="11" fill="#3e5d2e"/>
<text x="661" y="293" font-size="17" text-anchor="middle">0.384</text><text x="996" y="293" font-size="17" text-anchor="middle">0.837</text>
<text x="48" y="393" font-size="17">Dots: observed 8/12 and posterior mean 0.625; endpoints are not decision rules.</text>
</g></svg>
