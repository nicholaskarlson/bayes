<title id="title">Unit 4 prior and posterior for mean paired change</title>
<desc id="desc">Prior density centered at zero is broad. Exact posterior density is narrower and centered near 2.07 points. A dashed vertical line marks zero and a dotted vertical line marks an illustrative two-point meaningful-change threshold. The posterior overlaps both sides of two points.</desc>
